<th:block th:fragment="movie-table (movies, showDateWatched, returnUrl, site)">
    <table class="table">
        <tr>
            <th>
                Name
                <a th:href="@{${site}(searchName=${searchName},page=${page},sortBy='name',sortOrder=${sortOrder == 'asc' ? 'desc' : 'asc'})}">
                    <i th:if="${sortBy == 'name'}" th:class="${sortOrder == 'asc' ? 'bi bi-sort-alpha-down': 'bi bi-sort-alpha-up-alt'}"></i>
                    <i th:if="${sortBy != 'name'}" class="bi bi-arrow-down-up"></i>
                </a>
            </th>
            <th style="width:150px;">
                Streaming
                <a th:href="@{${site}(searchName=${searchName},page=${page},sortBy='streamingService',sortOrder=${sortOrder == 'asc' ? 'desc' : 'asc'})}">
                    <i th:if="${sortBy == 'streamingService'}" th:class="${sortOrder == 'asc' ? 'bi bi-sort-alpha-down': 'bi bi-sort-alpha-up-alt'}"></i>
                    <i th:if="${sortBy != 'streamingService'}" class="bi bi-arrow-down-up"></i>
                </a>
            </th>
            <th style="width:150px;" th:if="${showDateWatched}">
                Date watched
                <a th:href="@{${site}(searchName=${searchName},page=${page},sortBy='dateWatched',sortOrder=${sortOrder == 'asc' ? 'desc' : 'asc'})}">
                    <i th:if="${sortBy == 'dateWatched'}" th:class="${sortOrder == 'asc' ? 'bi bi-sort-alpha-down': 'bi bi-sort-alpha-up-alt'}"></i>
                    <i th:if="${sortBy != 'dateWatched'}" class="bi bi-arrow-down-up"></i>
                </a>
            </th>
            <th style="width:120px;">
                Rating
                <a th:href="@{${site}(searchName=${searchName},page=${page},sortBy='rating',sortOrder=${sortOrder == 'asc' ? 'desc' : 'asc'})}">
                    <i th:if="${sortBy == 'rating'}" th:class="${sortOrder == 'asc' ? 'bi bi-sort-numeric-down': 'bi bi-sort-numeric-up-alt'}"></i>
                    <i th:if="${sortBy != 'rating'}" class="bi bi-arrow-down-up"></i>
                </a>
            </th>
            <th style="width:120px;">Actions</th>
        </tr>
        <tr th:each="movie : ${movies}" class="center">
            <td th:if="${not #strings.isEmpty(movie.movieId)}">
                <a th:href="${movie.streamingUrl}" th:text="${movie.name}" target="_blank"></a>
                <i th:if="${not #strings.isEmpty(movie.description)}" class="bi bi-info-circle ms-1" th:title="${movie.description}"></i>
            </td>
            <td th:if="${#strings.isEmpty(movie.movieId)}">
                <span th:text="${movie.name}"></span>
                <i th:if="${not #strings.isEmpty(movie.description)}" class="bi bi-info-circle ms-1" th:title="${movie.description}"></i>
            </td>
            <td th:text="${movie.streamingService}"></td>
            <td th:if="${showDateWatched}" th:text="${#temporals.format(movie.dateWatched, 'yyyy-MM-dd')}"></td>
            <td>
                <span th:if="${movie.rating != null}" th:text="${'★'.repeat(movie.rating) + '☆'.repeat(5 - movie.rating)}"></span>
            </td>
            <td>
                <a th:href="@{/edit/{id}(id=${movie.id}, returnUrl=${returnUrl})}" class="btn btn-dark bi bi-pencil"></a>
                <a th:href="@{/delete/{id}(id=${movie.id}, returnUrl=${returnUrl})}" class="btn btn-dark bi bi-trash"></a>
            </td>
        </tr>
    </table>
</th:block>
